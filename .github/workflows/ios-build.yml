name: iOS Build and Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-framework:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build DiagnosticHost iOS device framework
        run: >-
          xcodebuild
          -project DiagnosticHost.xcodeproj
          -scheme DiagnosticHost
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath .frameworkDerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build DiagnosticHost iOS Simulator framework
        run: >-
          xcodebuild
          -project DiagnosticHost.xcodeproj
          -scheme DiagnosticHost
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .frameworkDerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Create XCFramework
        run: >-
          xcodebuild -create-xcframework
          -framework .frameworkDerivedData/Build/Products/Release-iphoneos/DiagnosticHost.framework
          -framework .frameworkDerivedData/Build/Products/Release-iphonesimulator/DiagnosticHost.framework
          -output DiagnosticHost.xcframework

      - name: Create MemoryEngine XCFramework dependency
        run: >-
          xcodebuild -create-xcframework
          -framework .frameworkDerivedData/Build/Products/Release-iphoneos/MemoryEngine.framework
          -framework .frameworkDerivedData/Build/Products/Release-iphonesimulator/MemoryEngine.framework
          -output MemoryEngine.xcframework

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: DiagnosticHost-iOS-XCFramework
          path: |
            DiagnosticHost.xcframework
            MemoryEngine.xcframework
          if-no-files-found: error

  build-and-test:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build iOS app for Simulator
        run: >-
          xcodebuild
          -project DiagnosticHost.xcodeproj
          -scheme DiagnosticHostApp
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .derivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Run MemoryEngine unit tests
        run: swift test

      - name: Upload compiled app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-memory-studio-ios-build
          if-no-files-found: warn
          path: |
            .derivedData/Build/Products/Debug-iphonesimulator/DiagnosticHostApp.app/**
